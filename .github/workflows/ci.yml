name: CI

on:
  push:
    branches: [main, develop, "phase/**"]
  pull_request:
    branches: [main, develop, "phase/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # pnpm version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # The tests run in parallel shards. The last shard takes every package that no other shard names, so a new
  # package is tested without anyone editing this file. Same tests as `pnpm test`, only split.
  tests:
    name: Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: finx-mcp
            filter: "--filter ./packages/finx-mcp"
          - shard: mock-bank-api
            filter: "--filter ./packages/mock-bank-api"
          - shard: journeys
            filter: "--filter ./packages/journey-schema --filter ./packages/renderer-core"
          - shard: everything else
            filter: "--filter !./packages/finx-mcp --filter !./packages/mock-bank-api --filter !./packages/journey-schema --filter !./packages/renderer-core"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present ${{ matrix.filter }} test

  # One check that stands for the typecheck and every test shard, under the name this repository has always used.
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    needs: [typecheck, tests]
    if: ${{ always() }}
    steps:
      - name: All parts passed
        run: |
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "tests: ${{ needs.tests.result }}"
          [ "${{ needs.typecheck.result }}" = "success" ] && [ "${{ needs.tests.result }}" = "success" ]

  web-build:
    name: Build the web app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @finx/bank-web build
