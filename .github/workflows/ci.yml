name: CI

on:
  push:
    branches: [main, develop, "phase/**"]
  pull_request:
    branches: [main, develop, "phase/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # pnpm version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # The tests run in parallel shards. The last shard takes every package that no other shard names, so a new
  # package is tested without anyone editing this file. Same tests as `pnpm test`, only split.
  # finx-mcp is most of the work (mutation checks), so its big file is dealt out in groups: see the top of
  # packages/finx-mcp/src/scenarios.test.ts. Shard 0 also runs that package's small files.
  tests:
    name: Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: "finx-mcp 1 of 6", mcp: 0, run: "pnpm --filter ./packages/finx-mcp test" }
          - { shard: "finx-mcp 2 of 6", mcp: 1, run: "pnpm --filter ./packages/finx-mcp exec vitest run src/scenarios.test.ts" }
          - { shard: "finx-mcp 3 of 6", mcp: 2, run: "pnpm --filter ./packages/finx-mcp exec vitest run src/scenarios.test.ts" }
          - { shard: "finx-mcp 4 of 6", mcp: 3, run: "pnpm --filter ./packages/finx-mcp exec vitest run src/scenarios.test.ts" }
          - { shard: "finx-mcp 5 of 6", mcp: 4, run: "pnpm --filter ./packages/finx-mcp exec vitest run src/scenarios.test.ts" }
          - { shard: "finx-mcp 6 of 6", mcp: 5, run: "pnpm --filter ./packages/finx-mcp exec vitest run src/scenarios.test.ts" }
          - { shard: "mock-bank-api", run: "pnpm --filter ./packages/mock-bank-api test" }
          - { shard: "journeys", run: "pnpm --filter ./packages/journey-schema --filter ./packages/renderer-core test" }
          - { shard: "everything else", run: "pnpm -r --if-present --filter !./packages/finx-mcp --filter !./packages/mock-bank-api --filter !./packages/journey-schema --filter !./packages/renderer-core test" }
    env:
      FINX_TEST_SHARD: ${{ matrix.mcp }}
      FINX_TEST_SHARDS: "6"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.run }}

  # One check that stands for the typecheck and every test shard, under the name this repository has always used.
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    needs: [typecheck, tests]
    if: ${{ always() }}
    steps:
      - name: All parts passed
        run: |
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "tests: ${{ needs.tests.result }}"
          [ "${{ needs.typecheck.result }}" = "success" ] && [ "${{ needs.tests.result }}" = "success" ]

  web-build:
    name: Build the web app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @finx/bank-web build
