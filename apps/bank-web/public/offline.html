<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You are offline</title>
</head>
<body style="margin:0;font-family:system-ui,sans-serif;background:#f6f7f9;color:#151a3d;display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px">
  <main>
    <h1 style="font-size:24px;margin:0 0 8px">You are offline</h1>
    <p style="margin:0 0 20px;color:#646a90">This app needs a connection. Check your network and try again.</p>
    <a href="javascript:location.reload()" style="display:inline-block;padding:12px 20px;border-radius:14px;background:#3155ce;color:#fff;text-decoration:none;font-weight:600">Try again</a>
  </main>
</body>
</html>
