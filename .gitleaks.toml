# Gitleaks configuration: the default rules stay on. The only exception is the sandbox bank's own unit test, which
# calls the password and recovery adapters with made-up test passwords; none of them is a real secret and the
# sandbox keeps only hashes. (The older single [allowlist] table is used because the scan action's gitleaks may predate [[allowlists]].)
[extend]
useDefault = true

[allowlist]
description = "Made-up test passwords in the sandbox bank's access (sign-in and recovery) unit test"
paths = ['''packages/mock-bank-api/src/access\.test\.ts''']
